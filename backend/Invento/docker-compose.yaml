services:
  postgres:
    image: postgres:16
    container_name: invento-postgres
    environment:
      POSTGRES_DB: invento
      POSTGRES_USER: invento
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - invento_postgres_data:/var/lib/postgresql/data
  app:
    build: .
    container_name: spring-Invento
    restart: always
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/invento
      POSTGRES_USER: invento
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_TOKEN: ${JWT_TOKEN}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
volumes:
  invento_postgres_data: