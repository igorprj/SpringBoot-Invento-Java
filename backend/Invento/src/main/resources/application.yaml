spring:
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/invento}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:Invento}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format-sql: true

jwt.token: ${JWT_TOKEN}
jwt.expiration: ${JWT_EXPIRATION}