spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/Invento
    driver-class-name: org.postgresql.Driver
    username: invento
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format-sql: true

jwt.token: ${JWT_TOKEN}
jwt.expiration: ${JWT_EXPIRATION}